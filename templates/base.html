<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Informasi Perpustakaan{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a',
                        secondary: '#3b82f6',
                        accent: '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-primary text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center text-xl">
                        <i class="fa-solid fa-book-bookmark text-amber-400"></i>
                    </div>
                    <div>
                        <a href="/" class="text-xl font-bold tracking-tight">PustakaDigital</a>
                        <p class="text-xs text-blue-200">Sistem Manajemen Perpustakaan Modern</p>
                    </div>
                </div>

                <!-- Navigation Links -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-800 transition {% if active_page == 'home' %}bg-blue-800{% endif %}">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i> Dashboard
                    </a>
                    <a href="/catalog" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-800 transition {% if active_page == 'catalog' %}bg-blue-800{% endif %}">
                        <i class="fa-solid fa-book-open mr-1.5"></i> Katalog (OPAC)
                    </a>
                    <a href="/loans" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-800 transition {% if active_page == 'loans' %}bg-blue-800{% endif %}">
                        <i class="fa-solid fa-right-left mr-1.5"></i> Sirkulasi
                    </a>
                    <a href="/books/new" class="ml-4 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold shadow transition flex items-center">
                        <i class="fa-solid fa-plus mr-1.5"></i> Tambah Buku
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 PustakaDigital. Dirancang berdasarkan PRD Perpustakaan Modern.</p>
    </footer>

</body>
</html>
