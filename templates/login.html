<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — PustakaDigital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>

<body
    class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl">
                <i class="fa-solid fa-book-bookmark text-amber-400 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white">PustakaDigital</h1>
            <p class="text-blue-300 text-sm mt-1">Masuk untuk melanjutkan</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-3xl shadow-2xl p-8">

            {% if error %}
            <div
                class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center">
                <i class="fa-solid fa-circle-exclamation mr-2 text-rose-500"></i>
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-5">
                {% if redirect %}
                <input type="hidden" name="redirect" value="{{ redirect }}">
                {% endif %}
                <div>
                    <label
                        class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Username</label>
                    <div class="relative">
                        <input type="text" name="username" required placeholder="masukkan username"
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50">
                        <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>
                <div>
                    <label
                        class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" name="password" required placeholder="masukkan password"
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition duration-200 text-sm flex items-center justify-center cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk
                </button>
            </form>

            <!-- Hint akun -->
            <div class="mt-6 p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-500 space-y-1">
                <p class="font-semibold text-slate-700 mb-2">Akun Demo Cepat:</p>
                <p><strong>Admin:</strong> admin / admin123</p>
                <p><strong>Pengunjung:</strong> pengunjung / kunjungi123</p>
            </div>

            <!-- Tautan Daftar Anggota Baru -->
            <div class="mt-5 pt-4 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">Belum menjadi anggota perpustakaan?</p>
                <a href="/register{% if redirect %}?redirect={{ redirect }}{% endif %}" class="mt-1.5 inline-block text-xs font-bold text-blue-600 hover:text-blue-800">
                    <i class="fa-solid fa-user-plus mr-1"></i> Daftar Anggota Baru Sekarang &rarr;
                </a>
            </div>

            <div class="mt-4 text-center">
                <a href="/" class="text-xs text-slate-400 hover:text-blue-600 transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda
                </a>
            </div>
        </div>
    </div>

</body>

</html>
